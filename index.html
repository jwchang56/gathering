<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聚會報名與點餐</title>
<style>
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --text: #17201b;
    --muted: #66716b;
    --line: #e1e6e3;
    --accent: #06c755;
    --accent-soft: #e4f8ec;
    --btn-bg: #04813a;
    --btn-text: #ffffff;
    --danger: #c0392b;
    --warn-bg: #fff4d6;
    --warn-text: #6b4e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101312;
      --surface: #1b1f1d;
      --text: #eef2ef;
      --muted: #9aa59f;
      --line: #2e3531;
      --accent: #06c755;
      --accent-soft: #12331f;
      --btn-bg: #06c755;
      --btn-text: #04220f;
      --danger: #ff8a7a;
      --warn-bg: #3a2f0c;
      --warn-text: #ffe08a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

  .center { padding: 80px 16px; text-align: center; color: var(--muted); }
  .center button { margin-top: 16px; }

  .hero { padding: calc(20px + env(safe-area-inset-top)) 4px 12px; }
  .hero h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; text-wrap: balance; }
  .meta { margin: 0; display: grid; gap: 2px; font-size: 14px; }
  .meta div { display: flex; gap: 10px; }
  .meta dt { color: var(--muted); flex: none; }
  .meta dd { margin: 0; }
  .hero-note { margin: 10px 0 0; font-size: 14px; color: var(--muted); white-space: pre-wrap; }

  .banner { margin: 8px 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--warn-bg); color: var(--warn-text); }

  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; margin: 8px -16px 12px; padding: 8px 16px; background: var(--bg); }
  .tabs button { flex: 1; padding: 10px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .pill { display: inline-block; margin-left: 4px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--text); font-size: 13px; font-variant-numeric: tabular-nums; }

  .card { margin: 0 0 12px; padding: 14px 16px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .card h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .field { display: block; }
  .field + .field { margin-top: 14px; }
  .field > span { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
  input[type="text"], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  textarea { min-height: 76px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-weight: 600; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .price { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepper button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); font-size: 20px; line-height: 1; }
  .stepper button:disabled { opacity: .35; }
  .stepper output { min-width: 32px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

  .submit-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: 0 -1px 0 var(--line);
  }
  .submit-bar > div { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .submit-bar .sum { flex: 1; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn { padding: 12px 20px; border: 0; border-radius: 12px; background: var(--btn-bg); color: var(--btn-text); font-weight: 700; }
  .btn:disabled { opacity: .5; }
  .btn-ghost { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; }
  .link-danger { display: block; margin: 4px auto 0; padding: 10px; border: 0; background: none; color: var(--danger); font-size: 14px; text-decoration: underline; }

  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { padding: 12px 14px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .kpi b { display: block; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .kpi.main { background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }

  .bar-row { padding: 8px 0; }
  .bar-row + .bar-row { border-top: 1px solid var(--line); }
  .bar-head { display: flex; gap: 8px; justify-content: space-between; }
  .bar-head .name { min-width: 0; overflow-wrap: anywhere; }
  .bar-head .qty { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; margin-top: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .total { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 10px; border-top: 2px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; }

  .person { padding: 10px 0; }
  .person + .person { border-top: 1px solid var(--line); }
  .person-head { display: flex; gap: 8px; justify-content: space-between; font-weight: 600; }
  .person-head .who { min-width: 0; overflow-wrap: anywhere; }
  .person-head .cnt { flex: none; color: var(--muted); font-weight: 400; font-size: 14px; }
  .person p { margin: 2px 0 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .person .me { margin-left: 6px; padding: 0 6px; border-radius: 6px; background: var(--accent-soft); font-size: 12px; font-weight: 600; }
  .person.absent .who { color: var(--muted); }
  .empty { margin: 0; color: var(--muted); font-size: 14px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { flex: 1 1 auto; }

  #toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 10;
    transform: translateX(-50%); max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 999px; background: #17201b; color: #fff; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<div id="app"><div class="center">載入中…</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(() => {
  'use strict';

  const CFG = Object.assign({ LIFF_ID: '', API_URL: '' }, window.APP_CONFIG || {});
  const DEMO = !CFG.API_URL;
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');

  const me = { uid: '', name: '', idToken: '', liff: false };
  let state = null;          // { event, menu, entries } 來自後端
  let tab = 'form';
  let busy = false;
  let draft = { name: '', attend: true, people: 1, items: {}, note: '' };

  // ---------- 小工具 ----------
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '$' + Number(n || 0).toLocaleString('en-US');
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, Math.round(Number(n) || 0)));

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, val) { try { localStorage.setItem(key, val); } catch { /* 無痕模式等情況：略過 */ } },
  };

  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('無法載入 LINE 元件，請檢查網路後重試'));
      document.head.appendChild(s);
    });
  }

  // ---------- 身分：LINE 內用 LINE 帳號，其他情況用訪客代碼 ----------
  async function initIdentity() {
    if (CFG.LIFF_ID) {
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: CFG.LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return new Promise(() => {}); // 等待跳轉到 LINE 登入
      }
      const profile = await liff.getProfile();
      me.uid = profile.userId;
      me.name = profile.displayName || '';
      me.idToken = liff.getIDToken() || '';
      me.liff = true;
      return;
    }
    let uid = store.get('gathering-guest-uid');
    if (!uid) {
      uid = 'guest-' + Array.from(crypto.getRandomValues(new Uint8Array(12)),
        (b) => b.toString(16).padStart(2, '0')).join('');
      store.set('gathering-guest-uid', uid);
    }
    me.uid = uid;
    me.name = store.get('gathering-guest-name') || '';
  }

  // ---------- 後端呼叫 ----------
  async function call(action, payload = {}) {
    if (DEMO) return demoCall(action, payload);
    const res = await fetch(CFG.API_URL, {
      method: 'POST',
      // 用 text/plain 可避免 CORS 預檢請求（Apps Script 不支援 OPTIONS）
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, uid: me.uid, idToken: me.idToken, ...payload }),
    });
    if (!res.ok) throw new Error('伺服器回應錯誤（' + res.status + '）');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '發生錯誤，請稍後再試');
    return data;
  }

  // 示範模式：沒有設定 API_URL 時，資料存在本機瀏覽器
  const DEMO_KEY = 'gathering-demo-entries-v1';
  const DEMO_EVENT = {
    name: '年終聚餐（示範）', time: '2026/12/05（六）18:30', place: '好味餐廳 2 樓包廂',
    note: '可隨時回來修改餐點。', deadline: '', closed: false,
  };
  const DEMO_MENU = [
    { name: '雞腿便當', price: 120 }, { name: '排骨便當', price: 110 },
    { name: '鯖魚便當', price: 130 }, { name: '素食便當', price: 100 },
    { name: '紅茶', price: 25 },
  ];
  const DEMO_SEED = [
    { uid: 'demo-a', name: '小明', attend: true, people: 2, items: { '雞腿便當': 1, '排骨便當': 1, '紅茶': 2 }, note: '一份不要辣' },
    { uid: 'demo-b', name: '阿芳', attend: true, people: 1, items: { '素食便當': 1 }, note: '' },
    { uid: 'demo-c', name: '大偉', attend: false, people: 0, items: {}, note: '當天出差' },
  ];
  function demoCall(action, p) {
    let entries;
    try { entries = JSON.parse(store.get(DEMO_KEY)) || DEMO_SEED; } catch { entries = DEMO_SEED; }
    entries = entries.filter((e) => e.uid !== me.uid || action === 'state');
    if (action === 'submit') {
      entries.push({ uid: me.uid, name: p.name, attend: p.attend, people: p.people, items: p.items, note: p.note });
    }
    if (action !== 'state') store.set(DEMO_KEY, JSON.stringify(entries));
    return Promise.resolve({
      ok: true, event: DEMO_EVENT, menu: DEMO_MENU,
      entries: entries.map(({ uid, ...rest }) => ({ ...rest, mine: uid === me.uid })),
    });
  }

  // ---------- 狀態 ----------
  // keepDraft：只更新統計資料，保留使用者還沒送出的修改
  function applyState(data, keepDraft = false) {
    const first = !state;
    state = { event: data.event || {}, menu: data.menu || [], entries: data.entries || [] };
    if (keepDraft && !first) return;
    const mine = state.entries.find((e) => e.mine);
    if (mine) {
      draft = {
        name: mine.name, attend: mine.attend, people: mine.attend ? Math.max(1, mine.people) : 1,
        items: { ...mine.items }, note: mine.note || '',
      };
    } else if (!draft.name) {
      draft.name = me.name;
    }
  }

  function computeStats() {
    const going = state.entries.filter((e) => e.attend);
    const qty = new Map(state.menu.map((m) => [m.name, 0]));
    for (const e of going) {
      for (const [k, v] of Object.entries(e.items || {})) qty.set(k, (qty.get(k) || 0) + (Number(v) || 0));
    }
    const priceOf = new Map(state.menu.map((m) => [m.name, Number(m.price) || 0]));
    const items = [...qty].map(([name, q]) => ({ name, qty: q, price: priceOf.get(name) || 0 }));
    return {
      going, absent: state.entries.filter((e) => !e.attend),
      people: going.reduce((s, e) => s + (Number(e.people) || 0), 0),
      items,
      totalQty: items.reduce((s, i) => s + i.qty, 0),
      totalAmount: items.reduce((s, i) => s + i.qty * i.price, 0),
      hasPrice: state.menu.some((m) => Number(m.price) > 0),
    };
  }

  function draftTotals() {
    let qty = 0, amount = 0;
    for (const m of state.menu) {
      const q = draft.items[m.name] || 0;
      qty += q; amount += q * (Number(m.price) || 0);
    }
    return { qty, amount };
  }

  const itemsText = (items) => Object.entries(items || {}).filter(([, q]) => q > 0)
    .map(([k, q]) => `${k}×${q}`).join('、');

  // ---------- 畫面 ----------
  function stepper(key, value, min, max, label, disabled) {
    return `<div class="stepper">
      <button type="button" data-act="step" data-key="${esc(key)}" data-d="-1" aria-label="${esc(label)} 減少" ${disabled || value <= min ? 'disabled' : ''}>−</button>
      <output aria-label="${esc(label)} 數量">${value}</output>
      <button type="button" data-act="step" data-key="${esc(key)}" data-d="1" aria-label="${esc(label)} 增加" ${disabled || value >= max ? 'disabled' : ''}>＋</button>
    </div>`;
  }

  function formHtml() {
    const closed = !!state.event.closed;
    const dis = closed ? 'disabled' : '';
    const mine = state.entries.some((e) => e.mine);
    const hasPrice = state.menu.some((m) => Number(m.price) > 0);
    const t = draftTotals();

    const menuCard = !draft.attend ? '' : `<section class="card">
      <h2>餐點</h2>
      ${state.menu.length ? state.menu.map((m) => `<div class="row">
        <div class="name">${esc(m.name)}${Number(m.price) > 0 ? ` <span class="price">${money(m.price)}</span>` : ''}</div>
        ${stepper('item:' + m.name, draft.items[m.name] || 0, 0, 99, m.name, closed)}
      </div>`).join('') : '<p class="empty">主辦人尚未設定菜單。</p>'}
    </section>`;

    return `
    <section class="card">
      <label class="field"><span>名稱</span>
        <input type="text" data-field="name" value="${esc(draft.name)}" maxlength="30" placeholder="請輸入您的名字" autocomplete="name" ${dis}>
      </label>
      <div class="field"><span>是否參加</span>
        <div class="seg">
          <button type="button" data-act="attend" data-v="1" aria-pressed="${draft.attend}" ${dis}>參加</button>
          <button type="button" data-act="attend" data-v="0" aria-pressed="${!draft.attend}" ${dis}>不參加</button>
        </div>
      </div>
      ${draft.attend ? `<div class="row" style="padding-bottom:0">
        <div class="name">人數（含自己）</div>
        ${stepper('people', draft.people, 1, 99, '人數', closed)}
      </div>` : ''}
    </section>
    ${menuCard}
    <section class="card">
      <label class="field"><span>備註${draft.attend ? '（例如：不要辣、飯少）' : ''}</span>
        <textarea data-field="note" maxlength="200" ${dis}>${esc(draft.note)}</textarea>
      </label>
    </section>
    ${mine && !closed ? '<button type="button" class="link-danger" data-act="cancel">取消我的報名</button>' : ''}
    ${closed ? '' : `<div class="submit-bar"><div>
      <div class="sum">${draft.attend ? `${draft.people} 人 · 餐點 ${t.qty} 份${hasPrice ? ' · ' + money(t.amount) : ''}` : '不參加'}</div>
      <button type="button" class="btn" data-act="submit" ${busy ? 'disabled' : ''}>${busy ? '傳送中…' : mine ? '更新報名' : '送出報名'}</button>
    </div></div>`}`;
  }

  function statsHtml() {
    const s = computeStats();
    const maxQty = Math.max(1, ...s.items.map((i) => i.qty));
    const people = [...s.going, ...s.absent];

    return `
    <section class="kpis">
      <div class="kpi main"><b>${s.people}</b><span>參加人數</span></div>
      <div class="kpi"><b>${s.totalQty}</b><span>餐點份數</span></div>
      <div class="kpi"><b>${state.entries.length}</b><span>已回覆</span></div>
      <div class="kpi"><b>${s.absent.length}</b><span>不參加</span></div>
    </section>
    <section class="card">
      <h2>餐點統計</h2>
      ${s.items.length ? s.items.map((i) => `<div class="bar-row">
        <div class="bar-head"><span class="name">${esc(i.name)}</span><span class="qty">${i.qty} 份</span></div>
        <div class="bar"><i style="width:${(i.qty / maxQty) * 100}%"></i></div>
      </div>`).join('') + `<div class="total"><span>合計</span><span>${s.totalQty} 份${s.hasPrice ? ' · ' + money(s.totalAmount) : ''}</span></div>`
        : '<p class="empty">尚無餐點資料。</p>'}
    </section>
    <section class="card">
      <h2>名單</h2>
      ${people.length ? people.map((e) => `<div class="person ${e.attend ? '' : 'absent'}">
        <div class="person-head">
          <span class="who">${esc(e.name)}${e.mine ? '<span class="me">我</span>' : ''}</span>
          <span class="cnt">${e.attend ? e.people + ' 人' : '不參加'}</span>
        </div>
        ${e.attend && itemsText(e.items) ? `<p>${esc(itemsText(e.items))}</p>` : ''}
        ${e.note ? `<p>備註：${esc(e.note)}</p>` : ''}
      </div>`).join('') : '<p class="empty">還沒有人回覆。</p>'}
    </section>
    <div class="actions">
      <button type="button" class="btn-ghost" data-act="refresh">重新整理</button>
      <button type="button" class="btn-ghost" data-act="share-stats">分享統計</button>
      ${CFG.LIFF_ID ? '<button type="button" class="btn-ghost" data-act="share-invite">分享報名連結</button>' : ''}
    </div>`;
  }

  function render() {
    const ev = state.event;
    const s = computeStats();
    const banners = [
      DEMO ? '示範模式：尚未連接 Google 試算表，資料只存在這台裝置。' : '',
      ev.closed ? '報名已截止，目前僅能查看統計結果。' : '',
    ].filter(Boolean).map((t) => `<div class="banner">${esc(t)}</div>`).join('');

    document.title = ev.name || '聚會報名與點餐';
    app.innerHTML = `
    <header class="hero">
      <h1>${esc(ev.name || '聚會')}</h1>
      <dl class="meta">
        ${ev.time ? `<div><dt>時間</dt><dd>${esc(ev.time)}</dd></div>` : ''}
        ${ev.place ? `<div><dt>地點</dt><dd>${esc(ev.place)}</dd></div>` : ''}
        ${ev.deadline ? `<div><dt>截止</dt><dd>${esc(ev.deadline)}</dd></div>` : ''}
      </dl>
      ${ev.note ? `<p class="hero-note">${esc(ev.note)}</p>` : ''}
    </header>
    ${banners}
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-act="tab" data-v="form" aria-selected="${tab === 'form'}">我要報名</button>
      <button type="button" role="tab" data-act="tab" data-v="stats" aria-selected="${tab === 'stats'}">統計結果<span class="pill">${s.people} 人</span></button>
    </nav>
    <main>${tab === 'form' ? formHtml() : statsHtml()}</main>`;
  }

  function showError(message) {
    app.innerHTML = `<div class="center"><p>${esc(message)}</p>
      <button type="button" class="btn" data-act="retry">重試</button></div>`;
  }

  // ---------- 分享 ----------
  function statsText() {
    const s = computeStats();
    const lines = [`【${state.event.name || '聚會'}】統計`,
      `參加 ${s.people} 人（${state.entries.length} 筆回覆，${s.absent.length} 筆不參加）`];
    const ordered = s.items.filter((i) => i.qty > 0);
    if (ordered.length) {
      lines.push('', '— 餐點 —', ...ordered.map((i) => `${i.name} × ${i.qty}`),
        `合計 ${s.totalQty} 份${s.hasPrice ? '，' + money(s.totalAmount) : ''}`);
    }
    const notes = s.going.filter((e) => e.note);
    if (notes.length) lines.push('', '— 備註 —', ...notes.map((e) => `${e.name}：${e.note}`));
    return lines.join('\n');
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
  }

  async function share(text) {
    if (me.liff && liff.isApiAvailable('shareTargetPicker')) {
      const res = await liff.shareTargetPicker([{ type: 'text', text }]);
      if (res) toast('已分享');
      return;
    }
    await copyText(text);
    toast('已複製，可貼到聊天室');
  }

  // ---------- 動作 ----------
  async function reload() {
    applyState(await call('state'), true);
    render();
  }

  async function submit() {
    const name = draft.name.trim();
    if (!name) { toast('請先填寫名稱'); app.querySelector('[data-field="name"]')?.focus(); return; }
    busy = true; render();
    try {
      const items = {};
      if (draft.attend) for (const m of state.menu) if (draft.items[m.name] > 0) items[m.name] = draft.items[m.name];
      const data = await call('submit', {
        name, attend: draft.attend, people: draft.attend ? draft.people : 0, items, note: draft.note.trim(),
      });
      if (!me.liff) store.set('gathering-guest-name', name);
      applyState(data);
      tab = 'stats';
      toast('已送出，謝謝！');
      window.scrollTo(0, 0);
    } catch (err) {
      toast(err.message);
    } finally {
      busy = false; render();
    }
  }

  async function cancel() {
    if (!confirm('確定要取消您的報名嗎？')) return;
    try {
      const data = await call('cancel');
      draft = { name: draft.name, attend: true, people: 1, items: {}, note: '' };
      applyState(data);
      toast('已取消報名');
    } catch (err) {
      toast(err.message);
    }
    render();
  }

  app.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    try {
      if (act === 'tab') {
        tab = el.dataset.v; render();
        if (tab === 'stats') await reload();
      } else if (act === 'attend') {
        draft.attend = el.dataset.v === '1'; render();
      } else if (act === 'step') {
        const d = Number(el.dataset.d), key = el.dataset.key;
        if (key === 'people') draft.people = clamp(draft.people + d, 1, 99);
        else {
          const name = key.slice(5);
          draft.items[name] = clamp((draft.items[name] || 0) + d, 0, 99);
        }
        render();
      } else if (act === 'submit') await submit();
      else if (act === 'cancel') await cancel();
      else if (act === 'refresh') { await reload(); toast('已更新'); }
      else if (act === 'share-stats') await share(statsText());
      else if (act === 'share-invite') {
        await share(`【${state.event.name || '聚會'}】報名與點餐請點這裡：\nhttps://liff.line.me/${CFG.LIFF_ID}`);
      } else if (act === 'retry') start();
    } catch (err) {
      toast(err.message || '發生錯誤');
    }
  });

  app.addEventListener('input', (e) => {
    const field = e.target.dataset && e.target.dataset.field;
    if (field) draft[field] = e.target.value;
  });

  async function start() {
    app.innerHTML = '<div class="center">載入中…</div>';
    try {
      if (!me.uid) await initIdentity();
      await reload();
    } catch (err) {
      showError(err.message || '載入失敗');
    }
  }

  start();
})();
</script>
</body>
</html>
